<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aria — App Store에서 받기</title>
<meta name="description" content="적기만 하면, 하루가 정리됩니다. AI 일정·할일 비서 Aria.">
<meta property="og:title" content="Aria — AI 일정·할일 비서">
<meta property="og:description" content="적기만 하면, 하루가 정리됩니다. App Store에서 받기.">
<meta property="og:image" content="https://letsaria.com/start/aria-icon.png">
<meta property="og:url" content="https://letsaria.com/start/">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="aria-icon.png">
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --ink: #1d1d1f; --sub: #6e6e73; --btn: #2563eb; --btn-ink: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --ink: #f5f5f7; --sub: #a1a1a6; --btn: #3b82f6; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); text-align: center; }
  img { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  h1 { margin: 18px 0 2px; font-size: 30px; letter-spacing: -0.02em; }
  .kind { margin: 0; color: var(--sub); font-size: 15px; }
  .line { margin: 18px 0 26px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35; }
  a.get { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 420px; min-height: 64px; border-radius: 18px; background: var(--btn); color: var(--btn-ink); font-size: 21px; font-weight: 700; text-decoration: none; -webkit-tap-highlight-color: transparent; }
  a.get:active { opacity: .85; }
  .fine { margin: 14px 0 0; color: var(--sub); font-size: 13px; }
  .more { margin-top: 22px; color: var(--sub); font-size: 14px; }
  .more a { color: var(--sub); }
</style>
</head>
<body>
<main>
  <img src="aria-icon.png" alt="Aria 앱 아이콘" width="104" height="104">
  <h1>Aria</h1>
  <p class="kind">AI 일정·할일 비서 · iPhone</p>
  <p class="line">적기만 하면,<br>하루가 정리됩니다.</p>
  <a class="get" href="https://apps.apple.com/kr/app/id6776524212?ct=meta&amp;mt=8" target="_top" rel="noopener">App Store에서 받기</a>
  <p class="fine">Aria Pro 첫 구독 7일 무료 체험 · 체험 후 자동 갱신</p>
  <p class="more"><a href="/ko/">Aria 더 알아보기</a></p>
</main>
</body>
</html>
